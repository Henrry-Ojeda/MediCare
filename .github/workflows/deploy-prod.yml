name: Deploy - Ambiente PRODUCCION (Requiere Autorización)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-approval-gate:
    name: Esperando Autorización Manual de Producción
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirmar despliegue autorizado a PRODUCCION
        run: echo "Despliegue a PRODUCCION aprobado manualmente por ${{ github.actor }}."

  build-and-deploy-prod:
    name: Build y Despliegue a PRODUCCION
    needs: production-approval-gate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Frontend PRODUCCION
        env:
          VITE_API_URL: ${{ vars.PROD_VITE_API_URL || 'https://api.medicare.local/api' }}
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Backend PRODUCCION (.NET 8)
        run: |
          dotnet publish Backend/MediCare.API/MediCare.API.csproj -c Release -o ./publish-prod

      - name: Subir Artefactos PRODUCCION
        uses: actions/upload-artifact@v4
        with:
          name: medicare-prod-bundle
          path: |
            dist/
            publish-prod/

      # Descomentar cuando configures SSH hacia tu VPS Contabo Producción:
